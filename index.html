<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LangGraph4j documentation">
  <title>LangGraph4j</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #ffffff;
      --text-color: #111827;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #111827;
        --text-color: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main aria-label="LangGraph4j">LangGraph4j</main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("./versions.json")
        .then(response => {
          if (!response.ok) {
            throw new Error("Could not fetch versions.json");
          }
          return response.json();
        })
        .then(versions => {
          if (!versions || versions.length === 0) {
            return;
          }

          const mainVersion = versions.find(v =>
            v.version === "main" || (v.aliases && v.aliases.includes("main"))
          );

          if (mainVersion) {
            window.location.replace(`./${mainVersion.version}/`);
          }
        })
        .catch(err => {
          console.error(err);
        });
    });
  </script>
</body>
</html>
