<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Langgraph4j DSL Visualizer</title>
  <script type="module" src="/dsl-view.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 28vw) 1fr;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #17212f;
    }

    aside {
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-right: 1px solid #d8dee8;
      background: #ffffff;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    label:has(#dsl-source) {
      height: 80%;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      color: #17212f;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    textarea {
      min-height: 0;
      resize: none;
      padding: 10px;
    }

    input {
      height: 34px;
      padding: 0 10px;
    }

    button {
      height: 34px;
      border: 1px solid #2563eb;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      min-width: 0;
      height: 100vh;
    }
  </style>
  <script type="module">
    async function loadGraph() {
      const view = document.querySelector('lg4j-dsl-view');
      const sourceView = document.querySelector('#dsl-source');
      const response = await fetch('/api/graph');
      if (!response.ok) {
        throw new Error(`Graph request failed: ${response.status}`);
      }
      const source = await response.text();
      sourceView.value = JSON.stringify(JSON.parse(source), null, 2);
      view.dispatchEvent(new CustomEvent('graph', { detail: source }));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const view = document.querySelector('lg4j-dsl-view');
      const activeNode = document.querySelector('#active-node');
      document.querySelector('#highlight-node').addEventListener('click', () => {
        view.dispatchEvent(new CustomEvent('graph-active', {
          detail: { node: activeNode.value.trim() }
        }));
      });
      loadGraph().catch((caught) => console.error(caught));
    });
  </script>
</head>
<body>
  <aside>
    <label>
      DSL JSON
      <textarea id="dsl-source" readonly spellcheck="false"></textarea>
    </label>
    <label>
      Active node
      <input id="active-node" type="text" placeholder="planner">
    </label>
    <button id="highlight-node" type="button">Highlight</button>
  </aside>
  <main>
    <lg4j-dsl-view></lg4j-dsl-view>
  </main>
</body>
</html>
